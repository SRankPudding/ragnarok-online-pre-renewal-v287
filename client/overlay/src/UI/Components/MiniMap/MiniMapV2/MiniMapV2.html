<div id="MiniMapV2" class="MiniMapUI">
	<button type="button" class="class-guides-menu">Class Guides</button>
	<div class="controls-hint">WASD: move · Shift: sprint · Right-drag: rotate / tilt · M: map</div>
	<div class="move-handle" title="Drag to move the minimap">&#10021;</div>
	<div class="map-location"><strong></strong><span></span></div>
	<canvas width="280" height="280"></canvas>
	<div class="info_container">
		<div class="coordinates">
			<span class="coord x">0</span>
			<span class="coord y">0</span>
		</div>
		<ui-button
			class="mini"
			bg="minimap/i_mini_1.bmp"
			hover="minimap/i_mini_2.bmp"
			down="minimap/i_mini_3.bmp"
		></ui-button>
		<ui-button
			class="viewon"
			bg="minimap/i_viewon_1.bmp"
			hover="minimap/i_viewon_2.bmp"
			down="minimap/i_viewon_3.bmp"
		></ui-button>
	</div>
</div>
