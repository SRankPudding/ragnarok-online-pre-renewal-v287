<div id="WinLogin" class="win_login">
	<h1>Ragnarok Online</h1>
	<p>Pre-Renewal</p>
	<label for="user">Username</label>
	<input id="user" class="user" type="text" autocomplete="username" />
	<label for="pass">Password</label>
	<input id="pass" class="pass" type="password" autocomplete="current-password" />
	<button class="save" type="button" aria-pressed="false">Remember username</button>
	<label class="save-password" hidden><input type="checkbox" /> Remember password</label>
	<button class="signup" type="button" hidden>Sign Up</button>
	<div class="actions">
		<button class="btn exit" type="button">Back</button>
		<button class="btn connect" type="button">Log in</button>
	</div>
</div>
